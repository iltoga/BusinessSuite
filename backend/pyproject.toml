[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api",
    "core",
    "landing",
    "payments",
    "products",
    "invoices",
    "fixtures",
    "customers",
    "business_suite",
    "customer_applications"
]

[tool.pytest.ini_options]
# Avoid recursing into heavy non-test directories that slow down collection
norecursedirs = [
  ".*",
  ".git",
  ".venv",
  ".hypothesis",
  "node_modules",
  "frontend",
  "frontend/node_modules",
  "frontend/dist",
  "frontend/dist-test",
  "dist",
  "build",
  "tmp",
  "logs",
  "static",
  "public",
  "business_suite.egg-info",
]
# Only consider files that follow the project's test naming convention
python_files = ["test_*.py"]
# Ensure markers are explicitly registered (helps catch typos) and run standard discovery
addopts = [
  "--cov=business_suite",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-branch",
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-django>=4.11.1",
  "pytest-cov>=4.0.0",
]
